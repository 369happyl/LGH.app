<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGH</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, #34345f, transparent 30%),
                radial-gradient(circle at 80% 80%, #162f4d, transparent 30%),
                #080812;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 850px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -3px;
        }

        .status {
            padding: 8px 14px;
            border: 1px solid #33334d;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
        }

        .hero {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 35px;
            backdrop-filter: blur(15px);
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(35px, 7vw, 70px);
            line-height: .95;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            font-size: 17px;
            max-width: 550px;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            min-height: 150px;
            padding: 22px;
            border-radius: 20px;
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.08);
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.09);
        }

        .emoji {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 19px;
            margin-bottom: 8px;
        }

        .card p {
            color: #999;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 17px;
            border: none;
            border-radius: 15px;
            background: white;
            color: #09090f;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            color: #555;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 25px;
            }
        }
    .portf {
        margin:5px;
        font-weight: bold;
        font-size: 22px;
    }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">LGH brabo</div>
        <div class="status">● online</div>
         
    </header>
     <div class="portf">slk portfolio kk</div>
        

    <section class="hero">
        <h1>Uma coisa<br>aleatória.</h1>

        <p id="frase">
            Você não precisava abrir esse aplicativo.
            Mas abriu. Agora já era.
        </p>

        <button onclick="gerar()">GERAR ALEATORIEDADE</button>
    </section>

    <div class="grid">

        <div class="card">
            <div class="emoji">🧠</div>
            <h2>Ideia</h2>
            <p id="ideia">Pensar em algo completamente inesperado.</p>
        </div>

        <div class="card">
            <div class="emoji">🔢</div>
            <h2>Número</h2>
            <p id="numero">42</p>
        </div>

        <div class="card">
            <div class="emoji">🌎</div>
            <h2>Destino</h2>
            <p id="destino">Amazonas</p>
        </div>

    </div>

    <footer>
        LGH — laboratório de coisas que provavelmente não precisavam existir.
    </footer>

</div>

<script>
    const frases = [
        "Hoje é um ótimo dia para fazer algo estranho.",
        "Talvez você devesse aprender alguma coisa nova.",
        "O universo continua funcionando. Impressionante.",
        "Você acabou de gastar alguns segundos lendo isso.",
        "Uma ideia aleatória pode virar um projeto.",
        "Não existe motivo. E esse é o motivo.",
        "mas talvez isso nao seja inutil",
        "juro que isso foi aleatorio",
        "por que você ainda está aqui?",
        "o que ce ta fazendo aqui ainda?",
        "você esta sozinho?",
        "o que você esta fazendo agora?",
        "por que voce é o que voce é?"
        
    ];

    const ideias = [
        "Criar uma linguagem de programação.",
        "Fazer um jogo que ninguém pediu.",
        "Criar um site que muda sozinho.",
        "Inventar uma palavra nova.",
        "Programar uma IA completamente inútil.",
        "Criar um aplicativo dentro de outro aplicativo."
    ];

    const destinos = [
        "Brasil", "Índia", "China", "Estados Unidos", "Japão", "Alemanha", "França", "Reino Unido", "Itália", "Canadá", 
    "Austrália", "Rússia", "África do Sul", "México", "Argentina", "Espanha", "Portugal", "Holanda", "Suécia", "Suíça",
    "Egito", "Nigéria", "Quênia", "Coreia do Sul", "Indonésia", "Nova Zelândia", "Grécia", "Turquia", "Arábia Saudita",
    "Colômbia", "Angola", "Moçambique", "Cabo Verde", "Guiné-Bissau", "São Tomé e Príncipe", "Timor-Leste", "Bélgica", 
    "Áustria", "Dinamarca", "Noruega", "Finlândia", "Irlanda", "Polônia", "República Tcheca", "Hungria", "Romênia",
    "Ucrânia", "Croácia", "Uruguai", "Chile", "Peru", "Equador", "Venezuela", "Bolívia", "Paraguai", "Cuba", "Jamaica", 
    "Costa Rica", "Panamá", "Guatemala", "Honduras", "El Salvador", "Nicarágua", "República Dominicana", "Canadá", "Marrocos",
    "Argélia", "Tunísia", "Líbia", "Gana", "Senegal", "Camarões", "Costa do Marfim", "Madagascar", "Etiópia", "Tanzânia", "Uganda",
    "Zâmbia", "Zimbábue", "Irã", "Iraque", "Israel", "Palestina", "Jordânia", "Líbano", "Síria", "Emirados Árabes Unidos", "Catar",
    "Coveite", "Omã", "Paquistão", "Bangladesh", "Tailândia", "Vietnã", "Filipinas", "Malásia", "Singapura", "Ucrânia", "Cazaquistão",
    "Mongólia"
    ];

    function aleatorio(lista) {
        return lista[Math.floor(Math.random() * lista.length)];
    }

    function gerar() {
        document.getElementById("frase").textContent = aleatorio(frases);
        document.getElementById("ideia").textContent = aleatorio(ideias);
        document.getElementById("numero").textContent =
            Math.floor(Math.random() * 9999) + 1;
        document.getElementById("destino").textContent = aleatorio(destinos);
    }
</script>

</body>
</html>
